[package]
name = "pks-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared native PKS retrieval core"

[lib]
name = "pks_core"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

