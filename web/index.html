<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Knowledge</title><link rel="stylesheet" href="/app.css"></head><body><aside><h1>Personal Knowledge</h1><p class="muted">Your data, searchable and explainable.</p><nav><button data-view="search" class="active">Search</button><button data-view="health">Health</button><button data-view="memory">Memory</button><button data-view="write">Capture</button><button data-view="review">Needs Review</button><button data-view="sources">Sources & Activity</button></nav><div id="status"></div></aside><main><section id="search" class="view"><div class="hero"><h2>Search everything you own</h2><div class="searchbar"><input id="q" placeholder="体检报告、eventId、吉他尾音……"><button id="go">Search</button></div></div><div id="results"></div><dialog id="reader"><button id="closeReader">Close</button><h3 id="readerTitle"></h3><div id="readerMeta" class="meta"></div><pre id="readerContent"></pre></dialog></section><section id="health" class="view hidden"><h2>Health timeline</h2><div class="toolbar"><select id="metric"><option value="creatinine">Creatinine / 肌酐</option><option value="cystatin_c">Cystatin C / 胱抑素C</option><option value="tacrolimus_trough">Tacrolimus</option></select><button id="loadHealth">Load</button></div><div id="timeline"></div></section><section id="memory" class="view hidden"><h2>Evidence-backed memory</h2><div class="toolbar"><select id="memoryDomain"><option>movies</option><option>books</option><option>health</option><option>general</option></select><button id="loadMemory">Build / Read</button></div><pre id="memoryOut"></pre></section><section id="write" class="view hidden"><h2>Capture to canonical store</h2><input id="title" placeholder="Title"><input id="domain" placeholder="Domain (Inbox, Movies, Books...)" value="Inbox"><textarea id="content" placeholder="Write something worth keeping..."></textarea><button id="save">Save</button><pre id="writeOut"></pre></section><section id="review" class="view hidden"><h2>Needs Review</h2><button id="loadReview">Refresh</button><div id="reviewOut"></div></section><section id="sources" class="view hidden"><h2>Sources & Activity</h2><div class="toolbar"><button id="syncNow">Sync now</button><button id="loadSources">Refresh</button></div><h3>Sources</h3><div id="sourcesOut"></div><h3>Recent changes</h3><div id="changesOut"></div><h3>Organization proposals</h3><div id="organizeOut"></div></section></main><script src="/app.js"></script></body></html>
